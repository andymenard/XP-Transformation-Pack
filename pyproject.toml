[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xplasma"
version = "0.1.0"
description = "Windows XP visual styles, natively, on KDE Plasma"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-2.0-or-later" }
# PySide6-Essentials rather than the full PySide6: the editor needs QtWidgets
# and QtGui only, and the full metapackage adds ~300 MB of Addons it never uses.
dependencies = [
    "Pillow>=10.0",
    "pefile>=2023.2.7",
    "PySide6-Essentials>=6.6",
    # Reads XP install media (ISO9660) without needing 7z/bsdtar on the host.
    "pycdlib>=1.14",
]

[project.scripts]
xplasma = "xplasma:main"
xplasma-edit = "appearance_editor:main"

[tool.setuptools]
# Flat layout under app/: the application is a set of top-level modules.
package-dir = { "" = "app" }
py-modules = [
    "appearance_editor", "applied_state", "apply", "aurorae_gen", "bundled_tools", "classic_gen",
    "colorscheme_gen", "fonts_gen", "hostexec", "msstyles_parse", "panel_layout", "panel_widgets",
    "paths", "plasmatheme_gen", "preview_gen", "revert", "setup_assets", "setup_ui", "start_applet",
    "startmenu_gen", "theme_file", "theme_index", "theme_presets", "title_shadow", "widget_style",
    "xplasma", "xp_assets", "xp_icons",
]
