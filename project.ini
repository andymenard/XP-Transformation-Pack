; XPlasma's project settings, in one place: its version, and the addresses
; it sends people to or fetches from. The build reads this file
; (src/app/CMakeLists.txt) into app/project.h; change it and rebuild.
; A value left empty is one XPlasma does without (no link, no check).

[Project]
; A release's number: a whole number, one more than the last release's.
; Setup offers to update an installed XPlasma with a lower one; the update
; check tells of a release with a higher one.
Version=1

; Where people report bugs -- Setup's page for a Plasma newer than
; XPlasma's builds links here, with what to include.
IssuesUrl=

; Where XPlasma looks for a newer release of itself: a small JSON file,
;   {"version": 2, "page": "https://...", "notes": "A line or two."}
; checked at most once a day at login; a newer version puts XP's update
; globe in the tray, and clicking it opens "page". Any host can serve it
; (a git host's raw file, a static page). Empty: no check.
UpdatesUrl=

; The Internet Archive: Windows XP's CD image and the theme packs are
; fetched from its items. (XPLASMA_ARCHIVE_URL overrides it, for tests.)
ArchiveUrl=https://archive.org
